name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + jq
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck jq; else sudo apt-get update -qq && sudo apt-get install -y shellcheck jq; fi
      - run: make test

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Real install (everything except Claude plugins)
        run: ./install.sh --yes --skip claude-code
      - name: Second run is a no-op
        run: ./install.sh --yes --skip claude-code | tee second.log && grep -q 'already done' second.log
      - name: zsh starts with the configured prompt
        run: zsh -ic 'echo "theme=$ZSH_THEME"; [ "$ZSH_THEME" = "powerlevel10k/powerlevel10k" ]'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/docker/run.sh
