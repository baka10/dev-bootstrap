# dev-bootstrap configuration (tracked defaults).
# Per-machine overrides go to bootstrap.local.conf (git-ignored);
# an exported environment variable or a CLI flag wins over both files.

# Which AI coding assistant to install and configure.
#   claude  - Claude Code CLI + plugins (superpowers, caveman) + ~/.claude config
#   copilot - GitHub Copilot CLI + ~/.copilot config
#   both    - both of the above
#   none    - skip AI tooling entirely
# CLI equivalent: ./install.sh --ai copilot
AI_ASSISTANT=claude

# Make zsh the login shell (1) or leave the current shell untouched (0).
CHANGE_SHELL=1

# Node version installed through nvm (any `nvm install` argument).
NODE_VERSION=lts/*
